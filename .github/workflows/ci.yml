on: [push, pull_request]
name: Continuous Integration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fw-ci:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./src/spice2x
    steps:
      - uses: actions/checkout@v5
      - name: Set ccache environment variables
        run: |
          echo "CCACHE_DIR=${{ github.workspace }}/src/spice2x/.ccache" >> $GITHUB_ENV
      - name: Install ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
      - name: Calculate commit SHA
        id: vars
        run: |
          calculatedSha=$(git rev-parse --short ${{ github.sha }})
          echo "COMMIT_SHORT_SHA=$calculatedSha" >> $GITHUB_ENV
      - name: Compile
        env:
          # 32-bit spice + spicecfg only; skip x264, linux, laa, 64-bit, WinXP
          SPICE_CI: "1"
        run: ./build_docker.sh
      - uses: actions/upload-artifact@v6
        with:
          name: spice2x-ci-${{ env.COMMIT_SHORT_SHA }}
          path: src/spice2x/bin
          if-no-files-found: error

  msvc-ci:
    name: Build (MSVC 32-bit)
    # windows-latest ships Visual Studio 2026; pin to the VS 2022 image, which is
    # the toolset spice2x is actually developed against
    runs-on: windows-2022
    defaults:
      run:
        working-directory: ./src/spice2x
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B cmake-build-msvc-32
          -A Win32
          -DSPICE_H264=OFF
      - name: Compile
        run: >
          cmake --build cmake-build-msvc-32
          --config Release --target spicetools_spice spicetools_cfg
